<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point hebdomadaire · option C, vue pleine</title>
<!-- PROTOTYPE, option C : un sujet prend tout l'écran, la liste se réduit à une colonne à gauche.
     Contenu fictif (Example Bank). -->
<link rel="stylesheet" href="look.css">
<link rel="stylesheet" href="dashboard.css">
<style>
#body { display: grid; }
.split { display: grid; grid-template-columns: 16.5rem minmax(0, 1fr); gap: 1.6rem; min-height: 0; }
.split[hidden], #overview[hidden] { display: none; }
.rail { display: grid; align-content: start; gap: .4rem; }
.rail button { display: grid; gap: .2rem; width: 100%; padding: .65rem 1rem .6rem; border: 1px solid var(--line); border-radius: .7rem; background: var(--surface); font: inherit; color: inherit; text-align: left; cursor: pointer; transition: border-color .15s ease-out; }
.rail button:hover { border-color: var(--accent); }
.rail .nm { font-size: 1rem; }
.rail .mv { padding: 0; border: 0; box-shadow: none; font-size: .6rem; }
.rail .flag { font-size: .6rem; font-family: var(--display); letter-spacing: .14em; text-transform: uppercase; }
.rail button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pane { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: .9rem; }
.pane header, .pane footer { display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 1.3rem 1.9rem 1.1rem; }
.pane header { border-bottom: 1px solid var(--line); }
.pane footer { padding: .8rem 1.9rem; border-top: 1px solid var(--line); }
.pane .scroll { overflow: auto; padding: 1.6rem 1.9rem 1.8rem; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
</style>
</head>
<body>
<nav class="dots" aria-label="Écrans">
  <a href="#s1" title="Avancement de la semaine"></a><a href="#s2" title="Décisions à prendre et points bloquants"></a><a href="#s3" title="Plan jusqu'à mardi prochain"></a><a href="#s4" title="Valeur apportée"></a>
</nav>
<main id="main">
<section class="slide" id="s1">
  <header class="head"><h1>Avancement de la semaine</h1><p class="lede" id="lede"></p></header>
  <div class="body" id="body">
    <div id="overview"><ol class="dash" id="list"></ol><div id="later"></div></div>
    <div class="split" id="split" hidden>
      <ol class="rail" id="rail"></ol>
      <article class="pane" aria-labelledby="d-title"><header id="pane-head"></header><div class="scroll" id="pane-body"></div><footer id="pane-foot"></footer></article>
    </div>
  </div>
  <div id="foot"></div>
</section>
</main>
<script src="data.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), S = WK.subjects;
  $('lede').innerHTML = WK.lede;
  $('later').innerHTML = WK.later;
  $('foot').outerHTML = WK.foot(1);
  $('main').insertAdjacentHTML('beforeend', WK.rest());
  $('list').innerHTML = WK.cols + S.map((s, i) => `<li>${WK.row(s, i)}</li>`).join('');
  $('rail').innerHTML = S.map((s, i) => `<li><button type="button" data-i="${i}"><span class="nm">${s.name}</span><span>${WK.pill(s)}${s.blocked ? ' <span class="flag sign alert">Bloqué</span>' : ''}</span></button></li>`).join('');
  const rail = [].slice.call(document.querySelectorAll('.rail button'));
  let cur = -1;

  function open(i) {
    cur = i;
    $('overview').hidden = true; $('split').hidden = false;
    $('pane-head').innerHTML = WK.head(S[i]) + '<button class="back" type="button" data-close>Tous les sujets</button>';
    $('pane-body').innerHTML = WK.detail(S[i]);
    $('pane-body').scrollTop = 0;
    $('pane-foot').innerHTML = WK.walk(i) + '<p class="walk"><kbd>&uarr;</kbd> <kbd>&darr;</kbd> pour changer de sujet · <kbd>Échap</kbd> pour revenir à la liste</p>';
    rail.forEach((b, n) => b.setAttribute('aria-current', n === i));
    rail[i].focus({ preventScroll: true });
  }
  function close() { cur = -1; $('split').hidden = true; $('overview').hidden = false; }
  $('split').addEventListener('click', e => {
    const step = e.target.closest('[data-step]'), b = e.target.closest('.rail button');
    if (step) open(cur + +step.dataset.step);
    else if (b) open(+b.dataset.i);
    else if (e.target.closest('[data-close]')) { const was = cur; close(); document.querySelectorAll('.subject.row')[was].focus(); }
  });
  $('list').addEventListener('click', e => { const row = e.target.closest('.row'); if (row) open(+row.dataset.i); });
  WK.keys({ current: () => cur, open, close });
})();
</script>
</body>
</html>
