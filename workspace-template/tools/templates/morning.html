<!doctype html>
<html lang="{{language}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}}</title>
<style>
/* The look of docs/design/morning.html in the kit. Each block of the page uses the shared rules;
   a block added later brings its own rules beside them. */
:root {
  --bar: #0e3b43;
  --bar-ink: #eef5f4;
  --bar-muted: #a9c6c5;
  --bar-warn: #ffc7c9;
  --bg: #f3f6f5;
  --surface: #ffffff;
  --ink: #142120;
  --ink-2: #3b4a48;
  --muted: #586664;
  --rule: #dde4e2;
  --edge: #6f7d7a;
  --btn: #ffffff;
  --btn-hover: #e6edeb;
  --tag: #e5ebe9;
  --brand: #0f5661;
  --brand-hover: #0a444e;
  --on-brand: #ffffff;
  --late: #b3152b;
  --soon: #7a4a00;
  --focus: #1257c0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bar: #0a2e35;
    --bar-ink: #e6f0ef;
    --bar-muted: #9dbbba;
    --bar-warn: #ffb3b6;
    --bg: #0f1514;
    --surface: #161e1d;
    --ink: #e7eeec;
    --ink-2: #c2cdcb;
    --muted: #98a6a3;
    --rule: #28322f;
    --edge: #6f7d7a;
    --btn: #1b2423;
    --btn-hover: #27322f;
    --tag: #232d2b;
    --brand: #63d2c6;
    --brand-hover: #86ded4;
    --on-brand: #06211f;
    --late: #ff9195;
    --soon: #f2b84f;
    --focus: #8fb8ff;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 0.9375rem/1.45 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  accent-color: var(--brand);
}
::selection { background: #0f5661; color: #ffffff; }
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; padding: 0; }
ol, ul { list-style: none; }
svg.i { width: 1rem; height: 1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.15em; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 82rem; margin: 0 auto; padding: 0 2rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.late { color: var(--late); font-weight: 600; }
.soon { color: var(--soon); font-weight: 600; }
h2 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.125rem 0.75rem; font-size: 1.25rem; line-height: 1.25; font-weight: 600; }
h2 .count { font-size: 0.875rem; font-weight: 400; color: var(--muted); }
h2 .count .late, h2 .count .soon { font-weight: 600; }

/* ---------- Top bar: the date and what was read ---------- */
.bar { background: var(--bar); color: var(--bar-ink); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.25rem 2rem; padding-top: 0.75rem; padding-bottom: 0.8125rem; }
h1 { font: 600 1.375rem/1.2 "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.005em; }
h1 .sub { font: 400 0.875rem/1.2 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: var(--bar-muted); letter-spacing: 0; margin-left: 0.625rem; }
.sources { display: flex; flex-wrap: wrap; align-items: center; gap: 0.25rem 1.25rem; font-size: 0.875rem; color: var(--bar-muted); }
.sources .src { display: inline-flex; align-items: center; gap: 0.375rem; }
.sources .fail { color: var(--bar-warn); font-weight: 600; }

/* ---------- Shared bits ---------- */
.ref { font-size: 0.8125rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ask { font: inherit; font-size: 0.8125rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; padding: 0.25rem 0.625rem; min-height: 2rem; border: 1px solid var(--edge); border-radius: 6px; background: var(--btn); color: var(--ink); cursor: pointer; white-space: nowrap; transition: background-color 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out; }
.ask:hover { background: var(--btn-hover); border-color: var(--ink-2); }
.ask:active { transform: translateY(1px); }
.ask.copied, .ask.copied:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chev { transition: transform 160ms ease-out; color: var(--muted); }
details[open] > summary .chev { transform: rotate(90deg); }

/* ---------- Today: one white sheet, its blocks side by side ---------- */
.sheet { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 0 1.5rem; margin-top: 1.125rem; padding: 0.875rem 1.25rem 0.75rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; }
.sheet > section + section { border-left: 1px solid var(--rule); padding-left: 1.5rem; }
.sheet > .block { margin-top: 0; }
.bank { display: inline-block; flex: none; font-size: 0.8125rem; font-weight: 400; line-height: 1.5; padding: 0 0.4375rem; border-radius: 4px; background: var(--tag); color: var(--ink-2); white-space: nowrap; }
.id { white-space: nowrap; }

.tt > li { position: relative; min-height: 2.375rem; border-top: 1px solid var(--rule); }
.tt summary { display: grid; grid-template-columns: 3.25rem 1.25rem minmax(0, 1fr); gap: 0 0.5rem; align-items: baseline; margin-right: 6.75rem; padding: 0.375rem 0; cursor: pointer; list-style: none; border-radius: 4px; }
.tt summary::-webkit-details-marker { display: none; }
.tt summary:hover .m-title { text-decoration: underline; text-decoration-color: var(--edge); text-underline-offset: 0.2em; }
.tt .t { font-weight: 600; font-size: 1.0625rem; line-height: 1.3; }
.tt .dur { font-weight: 400; font-size: 0.8125rem; color: var(--muted); }
.tt .opener { display: grid; place-items: center; align-self: start; width: 1.25rem; height: 1.25rem; margin-top: 0.125rem; border: 1px solid var(--edge); border-radius: 4px; }
.tt .opener .chev { color: var(--ink-2); }
.tt summary:hover .opener { background: var(--btn-hover); }
/* More than four meetings: one line each; the key line stays only when it is red or one of the three picks. */
.tt:has(> li:nth-child(5)) .m-key:not(:has(.late, .pick)) { display: none; }
.tt .m { display: grid; gap: 0.0625rem; min-width: 0; }
.tt .m-title { font-weight: 600; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.5rem; }
.tt .m-title .bank { font-weight: 400; }
.tt .m-key { font-size: 0.875rem; color: var(--ink-2); }
.tt .is-tentative .m-title { font-weight: 400; }
.tt li > .ask { position: absolute; right: 0; top: 0.1875rem; }
.brief { display: grid; grid-template-columns: 8.25rem minmax(0, 1fr); gap: 0.25rem 0.75rem; padding: 0.25rem 0 0.75rem 5.5rem; font-size: 0.875rem; }
.brief dt { color: var(--muted); }
.brief dd li + li { margin-top: 0.125rem; }
.brief .who, .brief .id { color: var(--muted); }
.brief .missing { font-weight: 600; }
.refused { padding: 0.5rem 0; border-top: 1px solid var(--rule); font-size: 0.875rem; }
.free { padding: 0.5rem 0 0; border-top: 1px solid var(--rule); font-size: 0.875rem; color: var(--ink-2); }
.free b { font-weight: 600; color: var(--ink); }

/* ---------- The register: ruled blocks ---------- */
main.wrap { padding-top: 0.5rem; padding-bottom: 2rem; }
.block { margin-top: 1.75rem; scroll-margin-top: 0.75rem; }
.block h2 { margin-bottom: 0.5rem; }
.grp { font-size: 0.8125rem; font-weight: 600; color: var(--ink-2); margin: 0.75rem 0 0.25rem; }
.block h2 + .grp { margin-top: 0; }
.grp-none { padding: 0.5rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font-size: 0.875rem; color: var(--muted); }

.rows { border-bottom: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: 10rem minmax(0, 1fr) 12.5rem 9.25rem; gap: 0 1rem; align-items: center; min-height: 2.5rem; padding: 0.25rem 0; border-top: 1px solid var(--rule); }
.when { position: relative; display: flex; align-items: baseline; gap: 0.5rem; padding-left: 1.375rem; white-space: nowrap; }
.when > svg.i { position: absolute; left: 0; top: 50%; margin-top: -0.5rem; }
.when b { font-weight: 600; }
.when .lag { font-size: 0.8125rem; font-weight: 600; }
.row.is-late .when { color: var(--late); }
.row.is-soon .when { color: var(--soon); }
.what { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 0.625rem; min-width: 0; }
.what .t { flex: 0 1 auto; font-weight: 600; }
.what .who { flex: 0 1 auto; color: var(--muted); }
.act { justify-self: end; }

.more > summary { display: inline-flex; align-items: center; gap: 0.375rem; padding: 0.5rem 0.5rem 0.5rem 0; cursor: pointer; list-style: none; font-size: 0.875rem; font-weight: 600; border-radius: 4px; }
.more > summary::-webkit-details-marker, .fold > summary::-webkit-details-marker { display: none; }
.more > summary:hover .lbl-t, .fold > summary:hover .tog { text-decoration: underline; text-underline-offset: 0.2em; }
.fold > summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 1.25rem; cursor: pointer; list-style: none; padding-bottom: 0.5rem; border-bottom: 1px solid var(--rule); border-radius: 4px; }
.fold > summary h2 { margin-bottom: 0; }
.fold > summary .tog { display: inline-flex; align-items: center; gap: 0.375rem; font-size: 0.875rem; font-weight: 600; white-space: nowrap; }
.fold[open] > summary { border-bottom: 0; }
details[open] > summary .closed-label, details:not([open]) > summary .open-label { display: none; }

footer.wrap { padding-bottom: 2rem; font-size: 0.8125rem; color: var(--muted); }
footer p { padding-top: 0.875rem; border-top: 1px solid var(--rule); }

.toast { position: fixed; left: 50%; bottom: 1.25rem; transform: translate(-50%, 1rem); max-width: min(46rem, calc(100vw - 2rem)); padding: 0.625rem 1rem; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 0.875rem; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); opacity: 0; pointer-events: none; transition: opacity 180ms ease-out, transform 180ms cubic-bezier(.16, 1, .3, 1); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast q { font-weight: 600; }
.toast.stay { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.75rem; pointer-events: auto; }
.toast input { flex: 1 1 22rem; min-width: 0; font: inherit; padding: 0.25rem 0.5rem; border: 1px solid var(--edge); border-radius: 4px; background: var(--bg); color: var(--ink); }
.toast button { font: inherit; font-weight: 600; padding: 0.25rem 0.625rem; border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; cursor: pointer; }
.toast :focus-visible { outline-color: var(--bg); }

@media (max-width: 1180px) {
  .row { grid-template-columns: 10rem minmax(0, 1fr) 9.25rem; }
  .row > .ref { display: none; }
}
@media (max-width: 1040px) {
  .sheet { grid-auto-flow: row; }
  .sheet > section + section { border-left: 0; padding-left: 0; padding-top: 1rem; }
}
@media (max-width: 820px) {
  .brief { grid-template-columns: 1fr; padding-left: 0; }
  .brief dt { margin-top: 0.25rem; }
  .wrap { padding: 0 1rem; }
  .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.125rem 1rem; padding: 0.5rem 0; }
  .row .when { flex: 1 1 auto; }
  .row .act { order: 1; margin-left: auto; }
  .row .what { order: 2; flex: 1 1 100%; padding-left: 1.375rem; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
</svg>

{{header}}

<main class="wrap">
{{blocks}}
</main>

<footer class="wrap"><p>{{footer}}</p></footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var L = {{script}};
  var toast = document.getElementById('toast');
  var hideTimer;
  var back;

  // Each copy button says on hover, and to a screen reader, which request it copies.
  document.querySelectorAll('[data-ask]').forEach(function (b) {
    b.title = L.copies + b.dataset.ask;
  });

  function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function hide() {
    if (toast.classList.contains('stay')) { toast.innerHTML = ''; if (back) back.focus(); }
    toast.classList.remove('show', 'stay');
  }

  function say(html, stay) {
    toast.innerHTML = html;
    toast.classList.add('show');
    toast.classList.toggle('stay', !!stay);
    clearTimeout(hideTimer);
    if (!stay) hideTimer = setTimeout(hide, 3200);
  }

  // Both copy routes refused: hand the request over in a field, selected, until it is closed.
  function refused(b, text) {
    back = b;
    say('<label for="req">' + esc(L.refused) + '</label><input id="req" readonly value="' + esc(text) + '"><button type="button" id="req-close">' + esc(L.close) + '</button>', true);
    var f = document.getElementById('req');
    f.focus();
    f.select();
    document.getElementById('req-close').addEventListener('click', hide);
  }

  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hide(); });

  function done(b, ok) {
    var text = b.dataset.ask;
    if (!ok) { refused(b, text); return; }
    var lbl = b.querySelector('.lbl');
    var use = b.querySelector('use');
    if (!b.dataset.label) b.dataset.label = lbl.textContent;
    b.style.minWidth = b.offsetWidth + 'px'; // keep the line still while the label reads "Copied"
    lbl.textContent = L.copied;
    use.setAttribute('href', '#i-check');
    b.classList.add('copied');
    say(esc(L.copied_toast).replace('{0}', '<q>' + esc(text) + '</q>'));
    clearTimeout(b._t);
    b._t = setTimeout(function () {
      lbl.textContent = b.dataset.label;
      use.setAttribute('href', '#i-copy');
      b.classList.remove('copied');
    }, 1600);
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-ask]');
    if (!b) return;
    var text = b.dataset.ask;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(b, true); }, function () { done(b, fallbackCopy(text)); });
    } else {
      done(b, fallbackCopy(text));
    }
  });
})();
</script>
</body>
</html>
