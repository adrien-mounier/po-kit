<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morning brief, Mon 16 Nov (option A)</title>
<!-- PROTOTYPE, option A: the day as an agenda drawn to scale, the details of the selected block in a
     panel beside it, the pending items behind a second tab. Fictional content (Example Bank). -->
<link rel="stylesheet" href="shared.css">
<style>
.top .wrap { padding-bottom: 0; }
.tabs { grid-column: 1 / -1; display: flex; gap: .25rem; margin-top: .625rem; }
.tab { padding: .5rem 1.125rem .5625rem; border: 0; border-radius: 8px 8px 0 0; background: transparent; color: var(--on-bar-soft); font-weight: 600; cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out; }
.tab:hover { background: rgba(255, 255, 255, .1); color: var(--on-bar); }
.tab[aria-selected="true"] { background: var(--bg); color: var(--heading); }
.tab .n { margin-left: .375rem; font-weight: 400; }

.today { display: grid; grid-template-columns: minmax(0, 1fr) minmax(22rem, 30rem); gap: 2.5rem; align-items: start; }
/* One row is a quarter of an hour: a block is as tall as it is long, unless its words need more. */
.rail { grid-template-rows: repeat(34, minmax(1.125rem, auto)); }
.tick { grid-column: 2; }
.short .b-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.short .b-key, .short .bank { display: none; }
.nowdot { position: absolute; z-index: 2; left: calc(4.25rem - .4375rem); width: .875rem; height: .875rem; margin-top: -.4375rem; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); pointer-events: none; transition: top .4s cubic-bezier(.16, 1, .3, 1); }
.rail .is-now > .blk { border-color: var(--accent); }
.rail .nowpill, .rail .bank { align-self: center; }

.panel { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow: auto; padding: 1.375rem 1.5rem 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 6px 18px rgba(0, 32, 96, .08), 0 1px 2px rgba(0, 32, 96, .06); }
.p-nav { display: flex; flex-wrap: wrap; align-items: center; gap: .25rem; margin-top: 1.25rem; padding-top: .75rem; border-top: 1px solid var(--line); font-size: .8125rem; color: var(--muted); }
.p-nav .hint { margin-left: auto; }
.p-nav .prev .i { transform: rotate(180deg); }
kbd { font: 600 .75rem var(--font); padding: .0625rem .3125rem; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--bg); }

.cols2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2rem 3.5rem; align-items: start; }

@media (max-width: 980px) {
  .today, .cols2 { grid-template-columns: 1fr; }
  .panel { position: static; max-height: none; }
}
</style>
</head>
<body>

<header class="top" id="top"></header>

<main class="wrap">
  <p class="lede" id="lede"></p>

  <div class="today" id="view-today" role="tabpanel" aria-labelledby="tab-today">
    <section aria-label="Today, hour by hour">
      <ol class="thread rail" id="rail"></ol>
      <div id="not"></div>
    </section>
    <aside class="panel" id="panel" aria-label="Details of the selected block"></aside>
  </div>

  <div class="cols2" id="view-pending" role="tabpanel" aria-labelledby="tab-pending" hidden></div>
</main>

<div id="foot"></div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const D = DAY, $ = id => document.getElementById(id);
  const row = m => (m - D.start) / 15 + 1;

  PK.header(`<nav class="tabs" role="tablist" aria-label="Today or pending">
    <button class="tab" role="tab" id="tab-today" aria-controls="view-today" type="button">Today</button>
    <button class="tab" role="tab" id="tab-pending" aria-controls="view-pending" type="button">Pending<span class="n">${PK.pendingCount}</span></button></nav>`);
  $('lede').innerHTML = D.lede;
  $('foot').innerHTML = PK.footer();
  $('not').innerHTML = PK.notToday();
  $('view-pending').innerHTML = `<div class="pend">${PK.group('you')}${PK.group('them')}</div><div class="pend">${PK.group('week')}${PK.group('backlog')}${PK.group('sort')}</div>`;

  let ticks = '';
  for (let i = 1; i <= 34; i++) ticks += `<li class="tick" aria-hidden="true" style="grid-row:${i}"></li>`;
  $('rail').innerHTML = ticks + D.blocks.map(b => {
    const len = b.end - b.start;
    return `<li class="stop k-${b.kind}${len < 30 ? ' short' : ''}" data-id="${b.id}" style="grid-row:${row(b.start)}/${row(b.end)}">
      <span class="s-time">${PK.fmt(b.start)}</span><span class="s-dot"></span>
      ${b.kind === 'break' ? `<span class="gap">${b.title}, ${PK.dur(len)}</span>`
        : `<button class="blk" type="button" id="${b.id}" aria-controls="panel"><span class="b-line"><span class="b-title">${PK.kindIcon(b)}${PK.pick(b.pick)}${b.title}</span>${b.bank ? `<span class="bank">${b.bank}</span>` : ''}<span class="b-dur">${PK.dur(len)}</span></span><span class="b-key">${b.key}</span></button>`}
    </li>`;
  }).join('') + `<li class="stop" style="grid-row:35"><span class="s-time">${PK.fmt(D.end)}</span><span class="s-dot"></span></li>
    <li class="travel" aria-hidden="true"></li><li class="nowdot" aria-hidden="true"></li>`;

  const rail = $('rail'), tickEls = rail.querySelectorAll('.tick');
  const travel = rail.querySelector('.travel'), nowdot = rail.querySelector('.nowdot');
  const y = t => { const i = Math.min(33, Math.floor((t - D.start) / 15)), el = tickEls[i]; return el.offsetTop + ((t - D.start) - i * 15) / 15 * el.offsetHeight; };

  let now = PK.now(), sel = PK.current(now).id, follow = true, shown = '';

  function paint() {
    rail.querySelectorAll('.stop[data-id]').forEach(li => {
      const b = PK.block(li.dataset.id), st = PK.stateOf(b, now);
      li.classList.toggle('is-past', st === 'past');
      li.classList.toggle('is-now', st === 'now');
      li.classList.toggle('is-sel', b.id === sel);
      const blk = li.querySelector('.blk'), pill = li.querySelector('.nowpill');
      if (blk) blk.setAttribute('aria-pressed', b.id === sel);
      if (blk && st === 'now' && !pill) blk.querySelector('.b-line').insertAdjacentHTML('beforeend', '<span class="nowpill">Now</span>');
      if (pill && st !== 'now') pill.remove();
    });
    const top = y(now);
    nowdot.style.top = top + 'px';
    travel.style.height = Math.max(0, top - 16) + 'px';

    const b = PK.block(sel), key = sel + PK.stateOf(b, now) + (sel === PK.current(now).id);
    if (key === shown) return; // leave the panel alone while nothing in it changed
    shown = key;
    const i = PK.selectable.indexOf(b);
    $('panel').innerHTML = PK.detail(b, now) + `<p class="p-nav">
      <button class="btn plain prev" type="button" data-step="-1"${i === 0 ? ' disabled' : ''}>${PK.icon('chev')}Earlier</button>
      <button class="btn plain" type="button" data-step="1"${i === PK.selectable.length - 1 ? ' disabled' : ''}>Later${PK.icon('chev')}</button>
      ${sel === PK.current(now).id ? '' : '<button class="btn plain" type="button" data-step="0">Back to now</button>'}
      <span class="hint"><kbd>&uarr;</kbd> <kbd>&darr;</kbd> to walk the day</span></p>`;
  }

  function select(id, focus) {
    sel = id; follow = id === PK.current(now).id; paint();
    if (focus) $(id).focus();
    $(id).scrollIntoView({ block: 'nearest' });
  }
  function step(n) {
    const i = PK.selectable.findIndex(b => b.id === sel) + n, b = n === 0 ? PK.current(now) : PK.selectable[i];
    if (b) select(b.id, true);
  }

  rail.addEventListener('click', e => { const b = e.target.closest('.blk'); if (b) select(b.id); });
  rail.addEventListener('keydown', e => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    e.preventDefault(); step(e.key === 'ArrowDown' ? 1 : -1);
  });
  $('panel').addEventListener('click', e => { const s = e.target.closest('[data-step]'); if (s) step(+s.dataset.step); });

  function show(view) {
    $('view-today').hidden = view !== 'today';
    $('view-pending').hidden = view !== 'pending';
    $('tab-today').setAttribute('aria-selected', view === 'today');
    $('tab-pending').setAttribute('aria-selected', view === 'pending');
    if (view === 'today') paint();
  }
  $('tab-today').addEventListener('click', () => show('today'));
  $('tab-pending').addEventListener('click', () => show('pending'));
  PK.onGoto = id => { show('today'); select(id, true); };

  show(location.hash === '#pending' ? 'pending' : 'today');
  PK.tick(t => { now = t; if (follow) sel = PK.current(now).id; if (!$('view-today').hidden) paint(); });
  window.addEventListener('resize', () => { if (!$('view-today').hidden) paint(); });
})();
</script>
</body>
</html>
