<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Point hebdomadaire · option B, en fenêtre</title>
<!-- PROTOTYPE, option B : le détail d'un sujet s'ouvre dans une fenêtre au-dessus de la liste.
     Contenu fictif (Example Bank). -->
<link rel="stylesheet" href="look.css">
<link rel="stylesheet" href="dashboard.css">
<style>
.pop { width: min(66rem, 92vw); max-height: 88vh; margin: auto; padding: 0; border: 1px solid var(--line); border-radius: 1rem; background: var(--bg); color: var(--ink); overflow: hidden; box-shadow: 0 1.6rem 4rem color-mix(in srgb, var(--heading) 28%, transparent), 0 .2rem .6rem color-mix(in srgb, var(--heading) 12%, transparent); }
.pop[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: pop .2s cubic-bezier(.16, 1, .3, 1); }
.pop::backdrop { background: color-mix(in srgb, var(--heading) 45%, transparent); }
@keyframes pop { from { opacity: 0; transform: translateY(.8rem); } }
.pop header, .pop footer { display: flex; align-items: center; justify-content: space-between; gap: 2rem; padding: 1.4rem 2rem 1.2rem; background: var(--surface); }
.pop header { border-bottom: 1px solid var(--line); }
.pop footer { padding: .9rem 2rem; border-top: 1px solid var(--line); }
.pop .scroll { overflow: auto; padding: 1.7rem 2rem 1.9rem; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.is-current.row { border-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .pop[open] { animation: none; } }
</style>
</head>
<body>
<nav class="dots" aria-label="Écrans">
  <a href="#s1" title="Avancement de la semaine"></a><a href="#s2" title="Décisions à prendre et points bloquants"></a><a href="#s3" title="Plan jusqu'à mardi prochain"></a><a href="#s4" title="Valeur apportée"></a>
</nav>
<main id="main">
<section class="slide" id="s1">
  <header class="head"><h1>Avancement de la semaine</h1><p class="lede" id="lede"></p></header>
  <div class="body"><ol class="dash" id="list"></ol><div id="later"></div></div>
  <div id="foot"></div>
</section>
</main>

<dialog class="pop" id="pop" aria-labelledby="d-title">
  <header id="pop-head"></header>
  <div class="scroll" id="pop-body"></div>
  <footer id="pop-foot"></footer>
</dialog>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id), S = WK.subjects, pop = $('pop');
  $('lede').innerHTML = WK.lede;
  $('later').innerHTML = WK.later;
  $('foot').outerHTML = WK.foot(1);
  $('main').insertAdjacentHTML('beforeend', WK.rest());
  $('list').innerHTML = WK.cols + S.map((s, i) => `<li>${WK.row(s, i)}</li>`).join('');
  const rows = [].slice.call(document.querySelectorAll('.subject.row'));
  let cur = -1;

  function open(i) {
    cur = i;
    $('pop-head').innerHTML = WK.head(S[i]) + '<button class="back" type="button" data-close>Fermer</button>';
    $('pop-body').innerHTML = WK.detail(S[i]);
    $('pop-body').scrollTop = 0;
    $('pop-foot').innerHTML = WK.walk(i) + '<p class="walk"><kbd>&uarr;</kbd> <kbd>&darr;</kbd> pour changer de sujet · <kbd>Échap</kbd> pour fermer</p>';
    rows.forEach((r, n) => { r.classList.toggle('is-current', n === i); r.setAttribute('aria-expanded', n === i); });
    if (!pop.open) pop.showModal();
  }
  function close() { if (pop.open) pop.close(); }
  pop.addEventListener('close', () => {
    const was = cur; cur = -1;
    rows.forEach(r => { r.classList.remove('is-current'); r.setAttribute('aria-expanded', 'false'); });
    if (was > -1) rows[was].focus();
  });
  pop.addEventListener('click', e => {
    const step = e.target.closest('[data-step]');
    if (step) open(cur + +step.dataset.step);
    else if (e.target.closest('[data-close]') || e.target === pop) close(); // the backdrop closes too
  });
  $('list').addEventListener('click', e => { const row = e.target.closest('.row'); if (row) open(+row.dataset.i); });
  WK.keys({ current: () => cur, open, close });
})();
</script>
</body>
</html>
